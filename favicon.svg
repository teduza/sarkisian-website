<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#181e2b"/>
      <stop offset="60%" stop-color="#0f121a"/>
      <stop offset="100%" stop-color="#07080c"/>
    </radialGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97f3d"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="favRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#d97f3d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c1440e" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle / Shield -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#favBg)" stroke="url(#favRim)" stroke-width="2"/>
  
  <!-- Subtle Internal Glow Circle -->
  <circle cx="32" cy="32" r="22" fill="#d97f3d" opacity="0.08"/>

  <!-- Stylized Serif Monogram 'S' -->
  <path d="M 44 22 C 43 17 38 14 31 14 C 23 14 18 18 18 24 C 18 29.5 22.5 32.5 28 34.5 L 34 36.8 C 39 38.8 41.5 41 41.5 44.5 C 41.5 49 37 51.5 30.5 51.5 C 23.5 51.5 19 48 18 42 L 24 40.5 C 24.5 43.5 27 46 31 46 C 34 46 36 44.5 36 42 C 36 39 33 37 28 35 L 23 33 C 17.5 31 13 28 13 22 C 13 15 19.5 10 29.5 10 C 37 10 43.5 13.5 45 20 Z" fill="url(#favGold)" filter="url(#glow)"/>

  <!-- Sovereign AI Star / Sparkle Accent (Top Right) -->
  <circle cx="48" cy="14" r="2.2" fill="#fef3c7"/>
  <path d="M 48 9.5 Q 48 14 43.5 14 Q 48 14 48 18.5 Q 48 14 52.5 14 Q 48 14 48 9.5 Z" fill="#fde68a"/>
</svg>
