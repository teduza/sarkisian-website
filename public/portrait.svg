<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e2436"/>
      <stop offset="60%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3348"/>
      <stop offset="50%" stop-color="#1b2130"/>
      <stop offset="100%" stop-color="#111520"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d8e2"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97f3d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c1440e" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="#d97f3d" opacity="0.06"/>

  <!-- Torso / Dark Tailored Suit -->
  <path d="M 90 400 C 95 310, 130 270, 200 270 C 270 270, 305 310, 310 400 Z" fill="url(#suitGrad)"/>

  <!-- Crisp White Dress Shirt V-Neck -->
  <polygon points="175 270, 225 270, 212 340, 200 355, 188 340" fill="url(#shirtGrad)"/>

  <!-- Jacket Lapels -->
  <path d="M 140 330 L 175 270 L 195 350 L 175 400 Z" fill="#181e2b"/>
  <path d="M 260 330 L 225 270 L 205 350 L 225 400 Z" fill="#141822"/>

  <!-- Neck -->
  <rect x="184" y="220" width="32" height="60" rx="8" fill="#e8c8b2"/>

  <!-- Head Base -->
  <ellipse cx="200" cy="175" rx="54" ry="68" fill="#f0d3c0"/>

  <!-- Hair (Short dark neat styled hair) -->
  <path d="M 142 165 C 140 115, 170 95, 200 95 C 235 95, 260 115, 258 165 C 255 130, 240 112, 200 112 C 160 112, 145 130, 142 165 Z" fill="#1e1814"/>
  <path d="M 145 150 C 155 110, 200 100, 248 115 C 256 122, 255 142, 255 142 C 248 122, 225 112, 195 115 C 165 118, 150 135, 145 150 Z" fill="#2d231d"/>

  <!-- Ears -->
  <ellipse cx="144" cy="180" rx="7" ry="14" fill="#e8c8b2"/>
  <ellipse cx="256" cy="180" rx="7" ry="14" fill="#e8c8b2"/>

  <!-- Eyebrows -->
  <path d="M 166 155 Q 180 150 192 154" stroke="#251c17" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 208 154 Q 220 150 234 155" stroke="#251c17" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="178" cy="166" rx="6" ry="4.5" fill="#2d1e15"/>
  <circle cx="179.5" cy="164.5" r="1.5" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="222" cy="166" rx="6" ry="4.5" fill="#2d1e15"/>
  <circle cx="223.5" cy="164.5" r="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Nose -->
  <path d="M 200 162 L 197 186 L 204 186" stroke="#dcb59f" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Confident Calm Smile -->
  <path d="M 188 206 Q 200 213 212 206" stroke="#b37c68" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Monogram Watermark / Verification Ring -->
  <circle cx="200" cy="200" r="196" fill="none" stroke="url(#goldRim)" stroke-width="3"/>
</svg>
